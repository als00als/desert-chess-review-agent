[project]
name = "desert-chess-review-agent"
version = "0.1.0"
description = "Unity C# 코드 리뷰 멀티에이전트 (버그·성능·Unity 안티패턴 리뷰어 + 검증 + 취합)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 수업 환경(enkoa-practice-advanced-agent uv.lock)과 같은 버전으로 고정한다.
# create_agent, ModelCallLimitMiddleware, wrap_tool_call 은 이 langchain 1.x 계열에만 있다.
dependencies = [
    "langchain==1.4.2",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langchain-typesafe==0.0.1a3",
    "typesafe-sdk==0.7.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "langfuse==4.14.0",
]

[tool.uv]
package = false
